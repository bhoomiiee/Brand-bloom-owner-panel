version: '3.8'

services:
  mongodb:
    image: mongo:6
    container_name: brandbloom-owner-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db

  owner-backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: brandbloom-owner-backend
    restart: unless-stopped
    ports:
      - "5001:5001"
    environment:
      - NODE_ENV=production
      - PORT=5001
      - MONGODB_URI=mongodb://mongodb:27017/store_owner_portal
      - API_PREFIX=/api/v1
      - CORS_ORIGIN=http://localhost:5174,http://localhost:5173,http://localhost:3000
    depends_on:
      - mongodb

  owner-frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: brandbloom-owner-frontend
    restart: unless-stopped
    ports:
      - "5174:80"
    depends_on:
      - owner-backend

volumes:
  mongo-data:
